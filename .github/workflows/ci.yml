name: ci

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      # No secrets are configured: tests use a fake LLM client, and
      # tests/conftest.py strips OPENAI_API_KEY so a real call cannot happen.
      - run: pytest
